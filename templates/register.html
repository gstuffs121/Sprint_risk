<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SprintAI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #172033 0%, #0b1020 70%);
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 460px;
    }
    .auth-card {
      background: rgba(23, 32, 51, 0.95);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 34px 28px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon" style="width:46px;height:46px;font-size:22px;margin-bottom:12px;">S</div>
        <h2 style="font-size:22px;font-weight:800;color:var(--text-main);margin:0;">Create SprintAI Account</h2>
        <p style="font-size:12px;color:var(--text-dim);margin-top:4px;">Join the sprint delivery workspace</p>
      </div>

      {% if error %}
      <div style="background:var(--danger-soft);border:1px solid rgba(239,68,68,0.3);color:var(--danger);padding:10px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:18px;">
        ⚠ {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Username *</label>
          <input type="text" name="username" class="form-control" placeholder="e.g. alexrivera" required autofocus autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" placeholder="e.g. Alex Rivera" autocomplete="name">
        </div>

        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Work Email *</label>
          <input type="email" name="email" class="form-control" placeholder="alex@company.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;font-size:14px;">
          Register Account &rarr;
        </button>
      </form>

      <div style="text-align:center;margin-top:20px;font-size:12.5px;color:var(--text-dim);">
        Already have an account? <a href="{{ url_for('auth.login') }}" style="color:var(--primary);font-weight:600;">Sign in</a>
      </div>
    </div>
  </div>

</body>
</html>
