<div class="kanban-card" id="task-card-{{ t.id }}">
  <div class="kanban-card-top">
    <span class="badge badge-{{ t.priority|lower }}">{{ t.priority }}</span>
    <span style="font-size:11px; color:var(--text-dim); font-family:var(--font-mono);">#{{ t.id }}</span>
  </div>

  <div class="card-title-text">{{ t.title }}</div>

  <div style="font-size:11px; color:var(--text-dim); margin-top:-4px;">
    {{ t.sprint_name or 'Sprint 14' }} &bull; Complexity {{ t.complexity }}/5
  </div>

  {% if t.risk_level %}
  <div style="margin-top:2px;">
    <span class="badge badge-{{ t.risk_level|lower }}" style="font-size:10px;">
      ⚠ Risk: {{ t.risk_level }} ({{ t.risk_probability }}%)
    </span>
  </div>
  {% endif %}

  <div class="card-meta-row" style="margin-top:4px;">
    <div style="display:flex; align-items:center; gap:6px;">
      <div style="width:20px; height:20px; border-radius:50%; background:var(--primary-soft); color:var(--primary); font-size:9.5px; font-weight:700; display:grid; place-items:center;">
        {{ (t.assignee or 'U')[:1]|upper }}
      </div>
      <span style="font-size:11px; color:var(--text-muted);">{{ t.assignee or 'Unassigned' }}</span>
    </div>
    <span style="font-size:11px; font-weight:600; color:var(--text-muted);">{{ t.estimated_hours }}h</span>
  </div>

  <!-- Fast Status Move Dropdown -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.06);">
    <select class="form-control" style="padding:2px 6px; font-size:10.5px; height:auto; width:110px;" onchange="updateTaskStatus('{{ t.id }}', this.value)">
      <option value="todo" {% if t.status == 'todo' %}selected{% endif %}>To Do</option>
      <option value="in_progress" {% if t.status == 'in_progress' %}selected{% endif %}>In Progress</option>
      <option value="blocked" {% if t.status == 'blocked' %}selected{% endif %}>Blocked</option>
      <option value="completed" {% if t.status == 'completed' %}selected{% endif %}>Completed</option>
    </select>

    <div style="display:flex; gap:4px;">
      <a href="{{ url_for('predictions.index', task_id=t.id) }}" class="btn btn-secondary btn-sm" style="padding:2px 6px; font-size:10px;" title="Run AI Prediction">
        ✳
      </a>
      <form action="{{ url_for('tasks.delete', task_id=t.id) }}" method="POST" style="margin:0;" onsubmit="return confirm('Delete this task?');">
        <button type="submit" class="btn btn-danger btn-sm" style="padding:2px 6px; font-size:10px;" title="Delete Task">✕</button>
      </form>
    </div>
  </div>
</div>
